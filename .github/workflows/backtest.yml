name: Backtest
on:
  workflow_dispatch: {}
  push:
    paths: ["backtest/istek.txt"]
permissions:
  contents: write
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Istanbul
      IKARUS_EVDS_KEY: ${{ secrets.EVDS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ikarus.backtest 2>&1 | tail -80 | tee backtest/log.txt || true
      - run: |
          git config user.name "ikarus-bot"
          git config user.email "ikarus-bot@users.noreply.github.com"
          git add backtest/
          git commit -m "Backtest sonucu" || exit 0
          git pull --rebase -q || true
          git push
