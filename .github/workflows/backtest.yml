name: Backtest
on:
  workflow_dispatch: {}
  push:
    paths: ["backtest/istek.txt"]
concurrency:
  group: backtest
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Europe/Istanbul
      IKARUS_EVDS_KEY: ${{ secrets.EVDS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if grep -q "^temel " backtest/istek.txt; then python -m ikarus.temel $(sed 's/^temel //' backtest/istek.txt) 2>&1 | tail -60 | tee backtest/log.txt || true;
          elif grep -q skor backtest/istek.txt; then python -m ikarus.skor_bt 2>&1 | tail -60 | tee backtest/log.txt || true; else python -m ikarus.backtest 2>&1 | tail -80 | tee backtest/log.txt || true; fi
      - run: |
          git config user.name "ikarus-bot"
          git config user.email "ikarus-bot@users.noreply.github.com"
          git add backtest/*.txt temel/*.txt; for f in temel/gecmis_pk.json.gz temel/gecmis_uzun.json.gz data/tufe.csv data/geri_alim.csv data/kap_pas.csv data/kap_pas_detay.csv; do [ -f $f ] && git add $f; done; git add backtest/*.csv || true
          git commit -m "Backtest sonucu" || exit 0
          for k in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep 5; done
      - name: Devam (KAP PDF okuma bitmediyse kendini yeniden baslat)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "^KALAN" backtest/log.txt 2>/dev/null; then gh workflow run backtest.yml --ref main -R ${{ github.repository }} && echo "yeniden baslatildi"; fi
