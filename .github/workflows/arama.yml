name: Isimsiz tablo arama
on:
  workflow_dispatch: {}
  push:
    paths: ["arama/istek.json"]
permissions:
  contents: write
jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Europe/Istanbul
      IKARUS_EVDS_KEY: ${{ secrets.EVDS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ikarus.arama 2>&1 | tee arama/log.txt || true
      - run: |
          git config user.name "ikarus-bot"
          git config user.email "ikarus-bot@users.noreply.github.com"
          git add arama/
          git commit -m "Arama sonucu" || exit 0
          git pull --rebase -q || true
          git push
