name: Telegram komut dinle

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  dinle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Istanbul
      IKARUS_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      IKARUS_TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - id: d
        run: python -m ikarus.telegram_dinle
      - name: Taramayi baslat
        if: steps.d.outputs.tara == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tarama.yml -R ${{ github.repository }}
      - name: Offset kaydet
        run: |
          git config user.name "ikarus-bot"
          git config user.email "ikarus-bot@users.noreply.github.com"
          git add data/telegram_offset.txt 2>/dev/null || exit 0
          git commit -qm "Telegram offset" || exit 0
          git pull --rebase -q || true
          git push || true
